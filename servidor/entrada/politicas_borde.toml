# Configuracion declarativa del proxy de borde Pingora (Oracle Cloud VPS)

[servidor_borde]
direccion_escucha = "0.0.0.0:443"
tls_minimo = "1.3"
proveedor_tls = "aws-lc-rs"
rechazo_invalido_ms = 1
maximo_cuerpo_kb = 512

[celulas]
cantidad_celulas = 77
encabezado_celula = "X-MiPlus-Sucursal"
capacidad_balde_por_celula = 120
recarga_por_segundo = 25

[corte_de_carga]
umbral_latencia_pg_p95_ms = 150
ventana_evaluacion_segundos = 10
rutas_sacrificables = ["/asistente-ia"]
rutas_prioritarias = ["/rpc/registrar_asiento_mayor_remoto", "/rpc/registrar_pase_vencimiento_remoto"]
estado_http_rechazo = 503

[almacenamiento_objetos_s3]
region = "sa-saopaulo-1"
prefijo_celda = "celdas/{sucursal_id}/"
prefijo_padron = "celdas/{sucursal_id}/padron/"
prefijo_respaldos_mayor = "celdas/{sucursal_id}/mayor/"
prefijo_no_inventariados = "celdas/{sucursal_id}/auditorias/"
formato_paquete = "mpak-zstd-ed25519"
